name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/xcursor-viewer.exe dist/
          windeployqt --release dist/xcursor-viewer.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: xcursor-viewer-windows
          path: dist/
